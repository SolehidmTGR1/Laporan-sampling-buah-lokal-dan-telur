function toggleKat(){let b=document.getElementById('boxKategori');b.style.display=b.style.display==='block'?'none':'block';if(b.style.display==='block')tampilKat();}
function tampilKat(){let q=(document.getElementById('cariKat').value||"").toLowerCase();let box=document.getElementById('isiKat');let keys=Object.keys(DB).sort();let f=k=>{if(!q)return true;let d=DB[k];return k.includes(q)||d.item.toLowerCase().includes(q)||(d.tidak||[]).join(" ").toLowerCase().includes(q);};let list=(arr)=>arr.length?arr.map(k=>{let d=DB[k];return "<div class='katItem' onclick=\"pilihKat('"+k+"')\"><b>"+k+" - "+d.item+"</b><br><small>"+d.mode+" | Min Brix: "+(d.minBrix||"0")+" | Sampling: "+d.fallback+"</small><br><small><b>TIDAK - SOP PDF:</b> <b>"+(d.tidak||[]).join(" | ")+"</b></small><br><small>Klik untuk pakai</small></div>";}).join(""):"<div>- Kosong -</div>";box.innerHTML="<b>Total: "+keys.length+" PLU - Buah: "+keys.filter(k=>DB[k].mode!='telur').length+" | Telur: "+keys.filter(k=>DB[k].mode=='telur').length+"</b><div class='katJudul'>BUAH - DETAIL</div>"+list(keys.filter(k=>DB[k].mode=='detail'&&f(k)))+"<div class='katJudul'>BUAH - FISIK</div>"+list(keys.filter(k=>DB[k].mode=='fisik'&&f(k)))+"<div class='katJudul'>TELUR - SOP TELUR VIA DC</div>"+list(keys.filter(k=>DB[k].mode=='telur'&&f(k)));}
function pilihKat(p){document.getElementById('plu').value=p;document.getElementById('pilihPLU').value=p;cariPLU();document.getElementById('boxKategori').style.display='none';window.scrollTo({top:0,behavior:'smooth'});}
function renderPLU(){let s=document.getElementById('pilihPLU');s.innerHTML='<option value="">-- Pilih PLU / Desc --</option>';Object.keys(DB).sort().forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k+' - '+DB[k].item;s.appendChild(o);});}
function pilihDD(){let v=document.getElementById('pilihPLU').value;if(!v)return;document.getElementById('plu').value=v;cariPLU();}
function setSelect(id,val){let el=document.getElementById(id);if(!el)return;let ada=[...el.options].some(o=>o.value==val);if(val&&!ada){let o=document.createElement('option');o.value=val;o.textContent=val;el.appendChild(o);}el.value=val||"";}
function build(){let n=JML||1;let d="";for(let i=1;i<=n;i++){d+="<div class='box'><b>Sampling "+i+" - Yang tidak standard huruf tebal</b><label>Brix / Kematangan</label><select id='d"+i+"Brix' onchange='cekBrix()'>"+optHTML(BRIX)+"</select><label>Taste / Aroma</label><select id='d"+i+"Taste'>"+optHTML(OPT.taste)+"</select><label>Bagian Tengah / Biji / Daging</label><select id='d"+i+"Biji'>"+optHTML(OPT.biji)+"</select><label>Kulit</label><select id='d"+i+"Kulit'>"+optHTML(OPT.kulit)+"</select><label>Tekstur</label><select id='d"+i+"Tekstur'>"+optHTML(OPT.tekstur)+"</select></div>";}document.getElementById('detailWrap').innerHTML=d;let f="";for(let i=1;i<=n;i++){f+="<div class='box'><b>Sampling "+i+"</b><select id='s"+i+"'>"+optHTML(OPT.fisik)+"</select></div>";}document.getElementById('fisikWrap').innerHTML=f;}
function isiTelur(){[['tKemasan',OPT.tKemasan],['tAroma',OPT.tAroma],['tKotor',OPT.tKotor],['tRetak',OPT.tRetak],['tCangkang',OPT.tCangkang],['tWarna',OPT.tWarna],['tLaser',OPT.tLaser]].forEach(([id,a])=>{document.getElementById(id).innerHTML=optHTML(a);});}
function hitung(){let qty=parseFloat(String(document.getElementById('terimaKg').value).replace(',','.'))||0;let item=document.getElementById('item').value.toLowerCase();let grup=item.includes('semangka')?'semangka':item.includes('melon')?'melon':item.includes('pepaya')?'pepaya':item.includes('mangga')?'mangga':item.includes('manggis')?'manggis':'lain';let T={semangka:[1,2,3,5],melon:[1,2,3,5],pepaya:[1,2,3,5],mangga:[5,7,10,15],manggis:[10,10,15,20]};let d=DB[document.getElementById('plu').value.trim()];let j=d?d.fallback:1;if(grup!=='lain'&&qty>0){let idx=qty<300?0:qty<=500?1:qty<=1000?2:3;j=T[grup][idx];}JML=j;build();}
function cekBrix(){let w=document.getElementById('warnBox');if(!MINBRIX){w.style.display="none";return;}let kurang=[];for(let i=1;i<=JML;i++){let el=document.getElementById('d'+i+'Brix');if(!el)continue;let v=parseFloat(String(el.value).replace(",","."));if(!isNaN(v)&&v<MINBRIX)kurang.push("Sampling "+i+" Brix "+v+" < SOP "+MINBRIX);}if(kurang.length){w.innerHTML="BRIX DI BAWAH SOP: "+kurang.join(" | ");w.style.display="block";}else w.style.display="none";}
function cariPLU(){let p=document.getElementById('plu').value.trim();let info=document.getElementById('pluInfo');let kb=document.getElementById('kriteriaBox');let tb=document.getElementById('tidakBox');if(!p){info.innerHTML="";kb.style.display="none";tb.style.display="none";return;}if(DB[p]){let d=DB[p];MINBRIX=d.minBrix||0;MINUMUR=d.minUmur||27;document.getElementById('item').value=d.item;if(d.sup)document.getElementById('sup').value=d.sup;document.getElementById('satuan').value=d.satuan||"Kg";document.getElementById('pilihPLU').value=p;setMode(d.mode);if(d.mode=='telur'){setSelect('tKemasan',d.tKemasan||"");setSelect('tAroma',d.tAroma||"");setSelect('tKotor',d.tKotor||"");setSelect('tRetak',d.tRetak||"");setSelect('tCangkang',d.tCangkang||"");setSelect('tWarna',d.tWarna||"");setSelect('tLaser',d.tLaser||"");document.getElementById('ketT').value=d.ket||"telur sesuai standard";}hitung();info.innerHTML="PLU ditemukan - "+d.item+" - SOP PDF";let labels=d.mode=='telur'?["Umur","Isi & Berat","Penyimpanan","Kemasan","Warna","Cangkang","Aroma","Catatan"]:["Brix","Size","Kematangan","Kulit","Daging","Tekstur","Toleransi","Catatan"];let html="<b>KRITERIA STANDARD - SOP PDF - "+d.item.toUpperCase()+" - PLU "+p+"</b><br>";labels.forEach((lb,i)=>{html+="<div class='row'><span>"+lb+"</span><span>"+(d.k[i]||"-")+"</span></div>";});kb.innerHTML=html;kb.style.display="block";let tHtml="<b>KATEGORI TIDAK - DITOLAK - SOP PDF - "+d.item.toUpperCase()+" - PLU "+p+"</b><br>";(d.tidak||[]).forEach((t,idx)=>{tHtml+="<div class='row'><span>TIDAK "+(idx+1)+"</span><span><b>"+t+"</b></span></div>";});tb.innerHTML=tHtml;tb.style.display="block";cekBrix();}else{info.innerHTML="PLU baru - isi Desc & Supplier";kb.style.display="none";tb.style.display="none";}}
function setMode(m){MODE=m;document.getElementById('mFisik').className=m=='fisik'?'active':'';document.getElementById('mDetail').className=m=='detail'?'active':'';document.getElementById('mTelur').className=m=='telur'?'active':'';document.getElementById('boxFisik').style.display=m=='fisik'?'block':'none';document.getElementById('boxDetail').style.display=m=='detail'?'block':'none';document.getElementById('boxTelur').style.display=m=='telur'?'block':'none';hitung();}
function setKes(v){KES=v;document.getElementById('btnTerima').className=v=='Di terima'?'active':'';document.getElementById('btnTolak').className='tolak '+(v=='Di tolak'?'active':'');}
function setKesD(v){KESD=v;document.getElementById('btnTerimaD').className=v=='Di terima'?'active':'';document.getElementById('btnTolakD').className='tolak '+(v=='Di tolak'?'active':'');}
function setKesT(v){KEST=v;document.getElementById('btnTerimaT').className=v=='Di terima'?'active':'';document.getElementById('btnTolakT').className='tolak '+(v=='Di tolak'?'active':'');}
function fmtKg(v){let n=parseFloat(String(v).replace(",","."));if(isNaN(n))return v;return n.toLocaleString("id-ID",{maximumFractionDigits:3});}
function fmtTgl(v){if(!v)v=new Date().toISOString().slice(0,10);let d=new Date(v+"T00:00:00");let b=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];return d.getDate()+" "+b[d.getMonth()]+" "+d.getFullYear();}
function getVal(id){let e=document.getElementById(id);return e?e.value.trim():"";}
function headerAll(j){let tgl=fmtTgl(document.getElementById('tgl').value);return j+"\nDC TGR 1\nTanggal :  "+tgl+"\n\nPlu         : "+(getVal('plu')||"-")+"\nItem       : "+(getVal('item')||"-")+"\nSuplier  : "+(getVal('sup')||"-")+"\n";}
function detailSample(no){let brix=getVal('d'+no+'Brix'),taste=getVal('d'+no+'Taste'),biji=getVal('d'+no+'Biji'),kulit=getVal('d'+no+'Kulit'),tek=getVal('d'+no+'Tekstur');if(!brix&&!taste&&!biji&&!kulit&&!tek)return "";return "Sampling "+no+" :\nBrix level : "+boldWA(brix)+"\nTaste : "+boldWA(taste)+"\nBagian tengah : "+boldWA(biji)+"\nKulit : "+boldWA(kulit)+"\nTekstur : "+boldWA(tek);}
function buat(){let sat=document.getElementById('satuan').value;let note=getVal('noteAkhir');let noteText=note?"\n\nNote : "+note:"";if(!getVal('poKg')||!getVal('terimaKg')){alert("Qty PO & Qty Tiba masih kosong!");return "";}let teks="";
if(MODE=='telur'){let ctn=parseFloat(getVal('poCtn'))||parseFloat(getVal('poKg'))||0;let samp=ctn<50?"Sortir Habis":ctn<=100?"Sampling 20% = "+(ctn*0.2).toFixed(1)+" Ctn":"Sampling 15% = "+(ctn*0.15).toFixed(1)+" Ctn";teks=headerAll("Laporan Sampling Telur")+"Qty PO : "+fmtKg(getVal('poKg'))+" "+sat+" ( "+getVal('poCtn')+" ctn )\nQty diterima    : "+fmtKg(getVal('terimaKg'))+" "+sat.toLowerCase()+" ( "+getVal('terimaCtn')+" ctn )\nSampling : "+samp+"\n\nTanggal Produksi : "+(getVal('tglProd')?fmtTgl(getVal('tglProd')):"-")+"\nTanggal Expired : "+(getVal('tglExp')?fmtTgl(getVal('tglExp')):"-")+"\nSisa Umur : "+boldWA(getVal('umurTelur'))+" (Min SOP: "+MINUMUR+" hari)\n\nHasil sampling sbb :\nKemasan : "+boldWA(getVal('tKemasan'))+"\nAroma : "+boldWA(getVal('tAroma'))+"\nKebersihan : "+boldWA(getVal('tKotor'))+"\nRetak / Pecah : "+boldWA(getVal('tRetak'))+"\nCangkang : "+boldWA(getVal('tCangkang'))+"\nWarna : "+boldWA(getVal('tWarna'))+"\nLaser / Stempel Omega : "+boldWA(getVal('tLaser'))+"\n\nKeterangan : "+boldWA(getVal('ketT'))+"\n\nKesimpulan : "+KEST+noteText;}
else if(MODE=='fisik'){let arr=[];for(let i=1;i<=JML;i++){let v=getVal('s'+i);if(v)arr.push("Sampling "+i+" : "+boldWA(v));}teks=headerAll("Laporan Sampling Buah Lokal")+"Qty PO : "+fmtKg(getVal('poKg'))+" "+sat+" ( "+getVal('poCtn')+" ctn )\nQty diterima    : "+fmtKg(getVal('terimaKg'))+" "+sat.toLowerCase()+" ( "+getVal('terimaCtn')+" ctn )\nJumlah Sampling : "+JML+" Sampling\n\nHasil sampling sbb :\n"+arr.join("\n")+"\n\nKeterangan : "+boldWA(getVal('ketF')||"fisik buah sesuai standard")+"\n\nKesimpulan : "+KES+noteText;}
else{let s=[];for(let i=1;i<=JML;i++){let x=detailSample(i);if(x)s.push(x);}teks=headerAll("Laporan Sampling Buah Lokal")+"Qty PO : "+fmtKg(getVal('poKg'))+" "+sat+" ( "+getVal('poCtn')+" ctn )\nQty diterima    : "+fmtKg(getVal('terimaKg'))+" "+sat.toLowerCase()+" ( "+getVal('terimaCtn')+" ctn )\nJumlah Sampling : "+JML+" Sampling\n\nHasil sampling sbb :\n"+s.join("\n")+"\n\nKeterangan : "+boldWA(getVal('ketD')||"fisik buah sesuai standard")+"\n\nKesimpulan : "+KESD+noteText;}
window._teks=teks;document.getElementById('hasilText').value=teks;document.getElementById('hasilBox').style.display="block";document.getElementById('hasilBox').scrollIntoView({behavior:"smooth"});return teks;}
function kosongkan(){['plu','item','sup','poKg','poCtn','terimaKg','terimaCtn','tglProd','tglExp','noteAkhir'].forEach(id=>{let e=document.getElementById(id);if(e)e.value="";});document.getElementById('pilihPLU').value="";document.getElementById('pluInfo').innerHTML="";document.getElementById('kriteriaBox').style.display="none";document.getElementById('tidakBox').style.display="none";document.getElementById('warnBox').style.display="none";document.getElementById('hasilBox').style.display="none";document.getElementById('hasilText').value="";window._teks="";MINBRIX=0;JML=1;build();setKes('Di terima');setKesD('Di terima');setKesT('Di terima');document.getElementById('tgl').value=new Date().toISOString().slice(0,10);document.getElementById('plu').focus();}
function salin(){let t=window._teks||buat();if(!t)return;navigator.clipboard.writeText(t).then(()=>alert("Tersalin"));}
function kirimWA(){let t=window._teks||buat();if(!t)return;window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank");}
isiTelur();document.getElementById('tgl').value=new Date().toISOString().slice(0,10);renderPLU();setMode('detail');JML=1;build();
</script></body></html>
